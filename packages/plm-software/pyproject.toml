[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plm-software"
version = "0.1.0"
description = "plm pack: Code tasks, checked by running the examples in a sandbox"
requires-python = ">=3.13"
dependencies = ["plm-core>=0.1,<0.2"]

[project.entry-points."plm.packs"]
software = "plm_software.manifest:PACK"

[tool.hatch.build.targets.wheel]
packages = ["src/plm_software"]
