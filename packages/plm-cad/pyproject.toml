[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plm-cad"
version = "0.1.1"
description = "plm pack: CAD parts as CadQuery programs, checked by building them with the OpenCascade kernel"
readme = "README.md"
authors = [{ name = "ro-rbl" }]
requires-python = ">=3.13"
license = "MIT"
# CadQuery is the checker: about 1.3 GB installed (VTK included, which it imports at load).
dependencies = ["plm-core>=0.1,<0.2", "cadquery>=2.8,<2.9"]

[project.entry-points."plm.packs"]
cad = "plm_cad.manifest:PACK"

[tool.hatch.build.targets.wheel]
packages = ["src/plm_cad"]

[project.urls]
Homepage = "https://github.com/ro-rbl/plm-orchestrator"
Source = "https://github.com/ro-rbl/plm-orchestrator"
Issues = "https://github.com/ro-rbl/plm-orchestrator/issues"
