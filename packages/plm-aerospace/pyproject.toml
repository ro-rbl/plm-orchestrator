[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plm-aerospace"
version = "0.1.0"
description = "plm pack: Aerospace calculations, checked by units and sanity rules"
requires-python = ">=3.13"
dependencies = ["plm-core>=0.1,<0.2"]

[project.entry-points."plm.packs"]
aerospace = "plm_aerospace.manifest:PACK"

[tool.hatch.build.targets.wheel]
packages = ["src/plm_aerospace"]
